[package]
name = "termfold"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Terminal input parsing and ANSI output for Rust (Linux): raw mode, key and mouse events, escape writers, and a crossterm-shaped path shim. Pre-release."
repository = "https://github.com/webfold-ai/termfold"
readme = "README.md"
publish = false

[dependencies]
# The text layout kernel — Ruler, Box, AFM.
ruler = { git = "https://github.com/webfold-ai/ruler", rev = "a37d96c7aeaf688fa912f28243a16a32558fac64" }
# Required: `terminal::KeyModifiers` is a `bitflags!` type in the default build.
bitflags = "2"

[workspace]
