name: Release

# Triggered by a version tag. termfold is a library (`publish = false`, no binary), so the
# release artifact is a source archive of the tagged tree, signed and attested.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing, artifact attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          toolchain: 1.88.0
      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${PACKAGE_VERSION}" = "${TAG_NAME}"
      - name: Check the tagged tree builds and passes tests
        run: |
          cargo build --locked --all-targets
          cargo test --locked
      - name: Package source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="termfold-${TAG_NAME}/" \
            -o "dist/termfold-${TAG_NAME}.tar.gz" HEAD
          (cd dist && sha256sum "termfold-${TAG_NAME}.tar.gz" > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts (keyless sigstore)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          for f in "termfold-${TAG_NAME}.tar.gz" SHA256SUMS; do
            cosign sign-blob --yes \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp \
                "^https://github.com/Ptyktos/termfold/\.github/workflows/release\.yml@refs/tags/${TAG_NAME//./\\.}$" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              "$f"
          done
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/termfold-*.tar.gz"
      - name: Attach provenance bundle to the release assets
        env:
          BUNDLE_B64: ${{ steps.attest.outputs.bundle }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          echo "$BUNDLE_B64" | base64 -d > "termfold-${TAG_NAME}.tar.gz.intoto.jsonl"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" \
            "termfold-${TAG_NAME}.tar.gz" \
            "termfold-${TAG_NAME}.tar.gz.sig" \
            "termfold-${TAG_NAME}.tar.gz.cert" \
            "termfold-${TAG_NAME}.tar.gz.intoto.jsonl" \
            SHA256SUMS SHA256SUMS.sig SHA256SUMS.cert \
            --generate-notes
